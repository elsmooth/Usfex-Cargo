<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>USFEX CARGO // ASSET EXCHANGE</title>
    <style>
        :root {
            --bg-primary: #08090c;
            --bg-surface: #0f1115;
            --border-clinical: #1c2026;
            --text-muted: #7f8c8d;
            --text-bright: #ffffff;
            --accent-gold: #d4af37;
            --font-mono: 'Courier New', Courier, monospace;
        }
        body {
            background-color: var(--bg-primary);
            color: var(--text-bright);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding: 20px;
        }
        header {
            border: 1px solid var(--border-clinical);
            background: var(--bg-surface);
            padding: 20px;
            margin-bottom: 25px;
            font-family: var(--font-mono);
        }
        .exchange-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
    </style>
</head>
<body>

    <header>
        <div style="font-weight: bold; font-size: 16px;">USFEX CARGO // CENTRAL REGISTRY</div>
        <div style="font-size: 11px; color: var(--text-muted); margin-top: 4px;">LIVE EXCHANGE ASSET POOL</div>
    </header>

    <main class="exchange-grid" id="marketplaceGridContainer">
        </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            loadLiveExchangeRegistry();
        });

        async function loadLiveExchangeRegistry() {
            const container = document.getElementById('marketplaceGridContainer');
            if (!container) return;

            try {
                const response = await fetch('http://localhost:5000/api/products/approved');
                const products = await response.json();
                container.innerHTML = '';

                if (!response.ok || products.length === 0) {
                    container.innerHTML = `
                        <div style="grid-column: 1 / -1; border: 1px dashed var(--border-clinical); padding: 40px; text-align: center; font-family: var(--font-mono); color: var(--text-muted); font-size: 12px;">
                            [NOTIFICATION] ALL ASSET REGISTRIES REALLOCATED OR LOCKED IN PRIVATE ESCROW POOLS.
                        </div>`;
                    return;
                }

                products.forEach(asset => {
                    const card = document.createElement('div');
                    card.style = "font-family: var(--font-mono); padding: 15px; border: 1px solid var(--border-clinical); background: var(--bg-surface);";
                    card.innerHTML = `
                        <div style="font-size: 14px; font-weight: bold; color: #ffffff;">${asset.title}</div>
                        <div style="color: var(--text-muted); font-size: 11px; margin: 8px 0;">SKU: ${asset.sku}</div>
                        <table style="width: 100%; font-size: 12px; color: #ccc; margin-bottom: 15px;">
                            <tr><td>MASS:</td><td style="text-align: right;">${asset.metric_mass}</td></tr>
                            <tr><td>VALUATION:</td><td style="text-align: right; color: #00ff66;">$${parseFloat(asset.gross_valuation).toLocaleString()}</td></tr>
                        </table>
                        <a href="product-detail.html?id=${asset.id}" style="display: block; background: #050608; border: 1px solid var(--border-clinical); color: #ffffff; text-align: center; padding: 10px; font-size: 11px; text-decoration: none; font-weight: bold;">INITIALIZE ACQUISITION FLOW</a>
                    `;
                    container.appendChild(card);
                });
            } catch (err) {
                console.error("Exchange link fault:", err);
            }
        }
    </script>
</body>
</html>
