<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>USFEX CARGO // DEPOSITORY INGRESS PORT</title>
    <style>
        :root {
            --bg-primary: #08090c;
            --bg-surface: #0f1115;
            --border-clinical: #1c2026;
            --text-muted: #7f8c8d;
            --text-bright: #ffffff;
            --accent-gold: #d4af37;
            --font-mono: 'Courier New', Courier, monospace;
        }
        body {
            background-color: var(--bg-primary);
            color: var(--text-bright);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding: 20px;
        }
        header {
            border: 1px solid var(--border-clinical);
            background: var(--bg-surface);
            padding: 20px;
            margin-bottom: 25px;
            font-family: var(--font-mono);
        }
        .form-panel {
            background: var(--bg-surface);
            border: 1px solid var(--border-clinical);
            padding: 30px;
            max-width: 600px;
            margin: 0 auto;
            font-family: var(--font-mono);
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 8px;
            text-transform: uppercase;
        }
        .form-group input {
            width: 100%;
            background: #050608;
            border: 1px solid var(--border-clinical);
            color: var(--text-bright);
            padding: 12px;
            font-family: var(--font-mono);
            font-size: 14px;
        }
        .form-group input:focus {
            border-color: var(--accent-gold);
            outline: none;
        }
        .submit-btn {
            width: 100%;
            background: #050608;
            border: 1px solid var(--accent-gold);
            color: var(--accent-gold);
            padding: 15px;
            font-family: var(--font-mono);
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
        }
        .submit-btn:hover {
            background: var(--accent-gold);
            color: var(--bg-primary);
        }
    </style>
</head>
<body>

    <header>
        <div style="font-weight: bold; font-size: 16px;">USFEX CARGO // ASSET DEPOSITORY INGRESS PORT</div>
        <div style="font-size: 11px; color: var(--text-muted); margin-top: 4px;">INITIALIZE ASSET MANIFEST VECTOR</div>
    </header>

    <main class="form-panel">
        <form id="ingressForm">
            <div class="form-group">
                <label>Consignment Title / Description</label>
                <input type="text" id="assetTitle" required placeholder="e.g., Certified Gold Bullion Lot">
            </div>
            <div class="form-group">
                <label>Metric Mass Value (kg)</label>
                <input type="text" id="assetWeight" required placeholder="e.g., 5.00 kg">
            </div>
            <div class="form-group">
                <label>Gross Asset Valuation (USD)</label>
                <input type="number" id="assetGross" required placeholder="e.g., 330000">
            </div>
            <button type="submit" class="submit-btn">Commit Manifest to Pipeline</button>
        </form>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const ingressForm = document.getElementById('ingressForm');
            if (ingressForm) {
                ingressForm.addEventListener('submit', executeAssetVaultIngress);
            }
        });

        async function executeAssetVaultIngress(event) {
            event.preventDefault();

            const payload = {
                title: document.getElementById('assetTitle').value,
                weight: document.getElementById('assetWeight').value,
                gross: document.getElementById('assetGross').value
            };

            try {
                const response = await fetch('http://localhost:5000/api/products/ingress', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${localStorage.getItem('usfex_auth_token')}`
                    },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                if (response.ok) {
                    alert(`ASSET MANIFEST DEPOSITED IN LIVE DB // SKU: ${data.asset.sku}\nSTATUS: AWAITING CLEARANCE.`);
                    document.getElementById('ingressForm').reset();
                    window.location.href = 'index.html';
                } else {
                    alert(`[INGRESS_REJECTION] Error: ${data.error}`);
                }
            } catch (err) {
                console.error("API Communication Failure:", err);
                alert("[CRITICAL_NETWORK_FAULT] Could not establish connection to operations server.");
            }
        }
    </script>
</body>
</html>
